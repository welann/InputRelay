name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (arm64)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Prepare version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0.' >&2
              exit 1
            fi
            echo "INPUTRELAY_VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"
            echo "PACKAGE_VERSION=$REF_NAME" >> "$GITHUB_ENV"
          elif [[ "$REF_NAME" == main ]]; then
            echo "PACKAGE_VERSION=continuous" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_VERSION=build-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi
          echo "INPUTRELAY_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          swift --version
          xcodebuild -version

      - name: Test
        run: swift test --disable-xctest

      - name: Build application
        run: ./build.sh release

      - name: Package and verify
        shell: bash
        env:
          ARCH: arm64
        run: |
          set -euo pipefail
          lipo .build/InputRelay.app/Contents/MacOS/InputRelay -verify_arch "$ARCH"
          codesign --verify --deep --strict .build/InputRelay.app
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            .build/InputRelay.app "dist/InputRelay-${PACKAGE_VERSION}-${ARCH}.zip"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: InputRelay-arm64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: InputRelay-*
          path: dist
          merge-multiple: true

      - name: Publish packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum InputRelay-*.zip > SHA256SUMS.txt
          if [[ "$REF_TYPE" != tag ]]; then
            # A slower old build must never replace a newer main build.
            CURRENT_HEAD=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            if [[ "$CURRENT_HEAD" != "$GITHUB_SHA" ]]; then
              echo 'Skipping superseded main build.'
              exit 0
            fi
            if gh api "repos/$GH_REPO/git/ref/tags/continuous" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/continuous" \
                -f sha="$GITHUB_SHA" -F force=true
            else
              gh api --method POST "repos/$GH_REPO/git/refs" \
                -f ref=refs/tags/continuous -f sha="$GITHUB_SHA"
            fi
            printf 'main 分支最新持续构建，适用于 Apple Silicon（M 系列）Mac。\n\n提交：%s\n构建：%s/%s/actions/runs/%s\n\n解压后将 InputRelay.app 放入“应用程序”。此版本使用临时签名，尚未经过 Apple 公证；更新后可能需要重新授予辅助功能权限。\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/release-notes.md"
            if gh release view continuous >/dev/null 2>&1; then
              gh release upload continuous InputRelay-*.zip SHA256SUMS.txt --clobber
              gh release edit continuous --title 'InputRelay 持续构建' --prerelease \
                --notes-file "$RUNNER_TEMP/release-notes.md"
            else
              gh release create continuous InputRelay-*.zip SHA256SUMS.txt --verify-tag \
                --title 'InputRelay 持续构建' --prerelease \
                --notes-file "$RUNNER_TEMP/release-notes.md"
            fi
            exit 0
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" InputRelay-*.zip SHA256SUMS.txt --clobber
          else
            gh release create "$VERSION" InputRelay-*.zip SHA256SUMS.txt \
              --verify-tag --title "InputRelay $VERSION" --generate-notes \
              --notes '此版本适用于 Apple Silicon（M 系列）Mac。解压后将 InputRelay.app 拖入“应用程序”。当前构建使用临时签名，尚未经过 Apple 公证，首次打开可能需要在系统设置的“隐私与安全性”中允许。'
          fi
